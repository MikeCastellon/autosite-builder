[build]
  command = "npm install --prefix netlify/functions && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."domain-sweep"]
  schedule = "*/2 * * * *"

# Screenshots of a reference site (custom-site-capture-background) drive a
# headless Chromium with puppeteer-core. esbuild can't bundle either
# package (dynamic requires, files read from the package at run time), so
# Netlify ships them as node_modules beside the function, with their
# dependencies. The Chromium binary itself is too big for a function: it
# is downloaded to /tmp at run time (@sparticuz/chromium-min).
[functions."custom-site-capture-background"]
  external_node_modules = ["puppeteer-core", "@sparticuz/chromium-min"]

# Edge function that resolves Host-based requests for customer custom
# domains and proxies them to the R2-backed site behind .autocaregeniushub.com.
[[edge_functions]]
  function = "serve-custom-domain"
  path = "/*"

[dev]
  command = "node ./node_modules/vite/bin/vite.js --port 5190"
  targetPort = 5190
  port = 8890
  host = "127.0.0.1"
  publish = "dist"
  autoLaunch = false

# Widget assets embedded on published sites must always be fresh so owner
# setting changes (theme, logo, services) appear without requiring a site
# republish or a hard browser refresh.
[[headers]]
  for = "/scheduler.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The HQ SSO landing carries a one-time sign-in token in its URL; never leak
# it to another origin in a Referer header.
[[headers]]
  for = "/auth/sso"
  [headers.values]
    Referrer-Policy = "no-referrer"

# Serve /.well-known/* directly from public/ (no SPA rewrite)
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200

# SPA fallback for everything else
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
